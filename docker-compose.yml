version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: addressbook_db
    environment:
      POSTGRES_DB: addressbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  web:
    build: .
    container_name: addressbook_web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: addressbook
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      - db
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
